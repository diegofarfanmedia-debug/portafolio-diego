<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>DIEGO FARFÁN — Director Creativo & Filmmaker</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #f4f6f9; --blueprint-blue: #1b365d; --text-main: #111111; --text-muted: #555555; --border: #d0d7de; }
        body { background-color: var(--bg-color); color: var(--text-main); margin: 0; font-family: 'Syne', sans-serif; }
        .site-wrapper { display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; }
        aside { position: fixed; top: 0; left: 0; width: 280px; height: 100vh; padding: 40px 30px; border-right: 1px solid var(--border); background: rgba(244, 246, 249, 0.95); z-index: 1000; }
        main { grid-column: 2; padding: 60px 80px; }
        .about-img { width: 100%; height: 420px; object-fit: cover; border-radius: 4px; border: 1px solid var(--border); }
        .section-title { font-size: 1.3rem; font-weight: 800; text-transform: uppercase; margin-bottom: 35px; color: var(--blueprint-blue); }
        .projects-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 35px; }
        .project-card { text-decoration: none; color: inherit; display: flex; flex-direction: column; gap: 12px; }
        .project-media { width: 100%; height: 380px; background: #111; border-radius: 4px; overflow: hidden; border: 1px solid var(--border); }
        .project-media img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
        .project-card:hover .project-media img { transform: scale(1.03); }
        .project-meta h3 { font-size: 1.1rem; font-weight: 800; text-transform: uppercase; color: var(--blueprint-blue); margin: 0; }
    </style>
</head>
<body>
    <div class="site-wrapper">
        <aside>
            <h2 style="color:var(--blueprint-blue)">DIEGO FARFÁN</h2>
            <nav>
                <p>Director Creativo & Filmmaker</p>
                <a href="#about">Sobre mí</a>
            </nav>
        </aside>
        <main>
            <section id="about">
                <h2 class="section-title">sobre mí</h2>
                <div style="display: grid; grid-template-columns: 1fr 1.2fr; gap: 40px;">
                    <!-- AQUÍ ESTÁ TU FOTO CON LA CALIDAD REAL -->
                    <img src="https://i.postimg.cc/n9rBNvmZ/IMG-4796.jpg" alt="Diego Farfán" class="about-img">
                    <div>
                        <p>Director creativo y filmmaker. Fusiono el lenguaje del cine de autor con la creación de contenido digital.</p>
                    </div>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
